<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>console-levels</title>
  </head>
  <body>
    <button id="press">press</button>
    <div id="count">0</div>
    <script>
      console.error("boom from the page");
      console.error(new Error("object arg detail"));
      console.warn("a warning");
      console.log("a plain log");
      console.debug("a debug line");
      console.info("an info line");
      console.table({ unmapped: 1 });
      let presses = 0;
      document.getElementById("press").addEventListener("click", function () {
        presses += 1;
        document.getElementById("count").textContent = String(presses);
      });
    </script>
  </body>
</html>
