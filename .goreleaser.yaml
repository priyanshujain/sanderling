version: 2

project_name: sanderling

before:
  hooks:
    # The Go binary embeds the sidecar fat JAR via //go:embed gated by the
    # `withsidecar` build tag. The Makefile target rebuilds the JAR and stages
    # it at the embed path, so the `go build` below picks up fresh bytes and
    # that path stays spelled out in exactly one place.
    - make sidecar-embed

builds:
  - id: sanderling
    main: ./cmd/sanderling
    binary: sanderling
    env:
      - CGO_ENABLED=0
    flags:
      - -tags=withsidecar
    ldflags:
      - -s -w -X main.Version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: sanderling
    ids:
      - sanderling
    formats: [tar.gz]
    name_template: "sanderling_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: priyanshujain
    name: sanderling
  draft: false
  prerelease: auto
