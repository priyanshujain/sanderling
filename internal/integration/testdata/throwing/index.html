<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>throwing</title>
  </head>
  <body>
    <button id="press">press</button>
    <div id="count">0</div>
    <script>
      let presses = 0;
      document.getElementById("press").addEventListener("click", function () {
        presses += 1;
        document.getElementById("count").textContent = String(presses);
        if (presses >= 3) {
          throw new Error("pressed too many times");
        }
      });
    </script>
  </body>
</html>
