name: release

# Promotes the last release to a milestone. ci cuts a patch on every merge, so
# the released versions run 0.1.4, 0.1.5, 0.1.6; this marks the one you have
# been running as 0.2.0 and publishes it under that name.
#
# It runs no checks of its own and needs none. The commit it releases is the one
# the last release was cut from, and that commit only carries a tag because a
# whole ci run went green on it.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of MAJOR.MINOR.PATCH to advance
        type: choice
        options:
          - minor
          - major
          - patch
        default: minor
      version:
        description: Release this version outright, e.g. 1.0.0 or 1.0.0-rc1. Overrides the bump.
        type: string
        required: false

permissions:
  contents: read

jobs:
  release:
    name: Release
    # No sha: this releases the commit the last release was cut from rather than
    # whatever master has drifted to since.
    uses: ./.github/workflows/release-publish.yml
    permissions:
      contents: write
    with:
      bump: ${{ inputs.bump }}
      version: ${{ inputs.version }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
